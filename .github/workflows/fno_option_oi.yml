name: NSE F&O Option OI Screener

on:
  push:
    branches: [ feature/fno-option-oi-screener ]
    paths:
      - '.github/workflows/fno_option_oi.yml'
      - 'nse_fno_option_screener.py'
      - 'tests/test_fno_option_oi_screener.py'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        default: "2026-09-25"
      end_date:
        description: "Historical end date (YYYY-MM-DD)"
        required: true
        default: "2026-10-30"
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  option-oi-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run option OI unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run option OI screener
        if: github.event_name == 'schedule'
        run: |
          python nse_fno_option_screener.py daily

      - name: Test NSE option bhavcopy download (two recent sessions)
        if: github.event_name == 'pull_request'
        run: |
          python nse_fno_option_screener.py backfill 2026-10-29 2026-10-30

      - name: Backfill one month of option OI history
        if: github.event_name == 'push'
        run: |
          python nse_fno_option_screener.py backfill 2026-09-25 2026-10-30

      - name: Backfill option OI history
        if: github.event_name == 'workflow_dispatch'
        run: |
          python nse_fno_option_screener.py backfill \
            "${{ inputs.start_date }}" \
            "${{ inputs.end_date }}"

      - name: Validate generated OI signal CSV
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import pandas as pd

          path = "fno_option_signals.csv"
          df = pd.read_csv(path)
          required = [
              "Change_in_OI", "Previous_Day_Change_in_OI",
              "Previous_Month_Max_Change_in_OI",
              "Total_OI", "Previous_Day_Total_OI",
              "Previous_Month_Max_Total_OI",
              "Change_OI_Month_Max_Pass",
              "Change_OI_2x_Previous_Day_Pass",
              "Total_OI_Month_Max_Pass",
              "Total_OI_2x_Previous_Day_Pass", "Combined_Signal"
          ]
          missing = [c for c in required if c not in df.columns]
          if missing:
              raise SystemExit(f"Missing signal columns: {missing}")
          if df.empty:
              print("Signal CSV is empty; no contracts passed all four rules.")
          else:
              numeric = [
                  "Change_in_OI", "Previous_Day_Change_in_OI",
                  "Previous_Month_Max_Change_in_OI", "Total_OI",
                  "Previous_Day_Total_OI", "Previous_Month_Max_Total_OI"
              ]
              for col in numeric:
                  df[col] = pd.to_numeric(df[col], errors="coerce")
              checks = {
                  "Change_OI_Month_Max_Pass": df["Change_in_OI"] > df["Previous_Month_Max_Change_in_OI"],
                  "Change_OI_2x_Previous_Day_Pass": df["Change_in_OI"] > 2 * df["Previous_Day_Change_in_OI"],
                  "Total_OI_Month_Max_Pass": df["Total_OI"] > df["Previous_Month_Max_Total_OI"],
                  "Total_OI_2x_Previous_Day_Pass": df["Total_OI"] > 2 * df["Previous_Day_Total_OI"],
              }
              for col, expected in checks.items():
                  actual = df[col].astype(str).str.lower().isin(["true", "1", "yes"])
                  if not actual.all() or not expected.fillna(False).all():
                      raise SystemExit(f"Signal validation failed: {col}")
              combined = df["Combined_Signal"].astype(str).str.lower().isin(["true", "1", "yes"])
              if not combined.all():
                  raise SystemExit("Combined_Signal contains a non-true row")
              print(f"Validated {len(df)} signal rows: all four OI conditions pass.")
              print(df[["Date", "Symbol", "Expiry", "Strike", "Option_Type",
                        "Change_in_OI", "Previous_Day_Change_in_OI",
                        "Previous_Month_Max_Change_in_OI", "Total_OI",
                        "Previous_Day_Total_OI", "Previous_Month_Max_Total_OI"]]
                    .head(5).to_string(index=False))
          PY

      - name: Save F&O option screener files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "NSE F&O Option Screener"
          git config user.email "actions@github.com"
          git add fno_option_history.csv fno_option_daily.csv fno_option_signals.csv
          git diff --cached --quiet || git commit -m "Update NSE F&O option OI signals"
          git push