name: NSE Delivery Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NSE delivery screener
        run: |
          python nse_delivery_screener.py
