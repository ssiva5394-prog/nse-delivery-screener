name: NSE Delivery Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NSE delivery screener
        run: |
          python nse_delivery_screener.py

      - name: Save scanner results
        run: |
          git config user.name "NSE Delivery Screener"
          git config user.email "actions@github.com"
          git add daily_data.csv signals.csv historical_signals.csv
          git diff --cached --quiet || git commit -m "Update NSE delivery signals"
          git push
